[project]
name = "kavithai2clip"
version = "0.1.0"
description = "Turn Tamil poetry into cinematic portrait video clips."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pillow>=11,<14",
    "numpy>=2,<3",
    "python-multipart>=0.0.20,<1",
    "edge-tts>=7,<8",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
